name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        include:
          - ruby: '3.4'
            active-model: '8.0.2'
            couchbase: '7.2.3'
          - ruby: '3.3'
            active-model: '8.0.0'
            couchbase: '7.2.3'
          - ruby: '3.3'
            active-model: '7.2'
            couchbase: '7.2.3'
      fail-fast: false
    runs-on: ubuntu-24.04
    name: ${{ matrix.ruby }} rails-${{ matrix.active-model }}  couchbase-${{ matrix.couchbase }}
    steps:
    - uses: actions/checkout@v3
    - run: |
        sudo apt-get update
        sudo apt-get install -y libevent-dev libev-dev python3-httplib2
        sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: sudo ./ci/run_couchbase.sh $COUCHBASE_VERSION $COUCHBASE_BUCKET $COUCHBASE_USER $COUCHBASE_PASSWORD
    - run: bundle exec rspec
    env:
      ACTIVE_MODEL_VERSION: ${{ matrix.active-model }}
      BUNDLE_JOBS: 4
      BUNDLE_PATH: vendor/bundle
      COUCHBASE_BUCKET: default
      COUCHBASE_USER: tester
      COUCHBASE_PASSWORD: password123
      COUCHBASE_VERSION: ${{ matrix.couchbase }}
